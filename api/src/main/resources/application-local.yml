# Perfil LOCAL — desarrollo en máquina local o K8s de desarrollo.
# Activa con: SPRING_PROFILES_ACTIVE=local

spring:
  datasource:
    # Credenciales de desarrollo; sobreescribibles vía variables de entorno
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rehabiapp}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
  jpa:
    # Muestra el SQL generado por Hibernate — útil en desarrollo para detectar N+1
    show-sql: true
    properties:
      hibernate:
        # Formatea el SQL para mayor legibilidad en los logs
        format_sql: true

# URL del data pipeline — 8081 ocupado por phpMyAdmin en dev local
rehabiapp:
  data-service:
    url: ${REHABIAPP_DATA_SERVICE_URL:http://localhost:8082}
  data:
    url: ${REHABIAPP_DATA_SERVICE_URL:http://localhost:8082}

# Origenes CORS permitidos en desarrollo local:
# - localhost:9000 (juego Unity WebGL servido localmente via python -m http.server)
# - bucket S3 del juego PIANO para pruebas contra API local
# - puertos varios para mobile frontend / BFF dev
app:
  cors:
    allowed-origins:
      - http://localhost:9000
      - http://localhost:5173
      - http://localhost:8081
      - http://localhost:3000
      - http://s3-bucket-rehabiapp-piano-640681720314.s3-website-us-east-1.amazonaws.com

# Nivel de log detallado para desarrollo
logging:
  level:
    com.rehabiapp: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
