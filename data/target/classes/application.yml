# Configuracion principal del pipeline de datos de RehabiAPP
# Puerto 8081 obligatorio para evitar colision con el API Core en 8080

spring:
  profiles:
    # Perfil por defecto cuando SPRING_PROFILES_ACTIVE no esta seteado.
    # Garantiza que logback-spring.xml tenga al menos un appender activo.
    default: local

server:
  port: ${SERVER_PORT:8081}
  tomcat:
    # Directorio base de Tomcat en /tmp para compatibilidad con filesystem de solo lectura en K8s
    basedir: /tmp

# Configuracion de Spring Boot Actuator para health probes de Kubernetes
management:
  endpoints:
    web:
      exposure:
        # Exponer health (probes K8s), info y prometheus (scraping de metricas)
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        # Habilita /actuator/health/liveness y /actuator/health/readiness
        enabled: true
      # No exponer detalles de health para evitar fuga de informacion
      show-details: never
  health:
    livenessState:
      enabled: true
    readinessState:
      # readiness incluye comprobacion de conectividad con MongoDB
      enabled: true

# Configuracion de CSFLE (Client-Side Field Level Encryption)
# Obligatorio segun el skill springboot4-mongodb para datos de pacientes
# La configuracion real del MongoClient con auto-encryption se implementa
# cuando se crean los modelos de datos (fuera del alcance de esta fase K8s)
rehabiapp:
  csfle:
    enabled: ${CSFLE_ENABLED:false}
    # Namespace del key vault en MongoDB para las claves de cifrado
    key-vault-namespace: "encryption.__keyVault"
    # Proveedor KMS: "local" en desarrollo, "aws" en produccion via IRSA
    kms-provider: ${CSFLE_KMS_PROVIDER:local}
    # Ruta a la clave maestra montada via CSI secrets en K8s
    master-key-path: ${CSFLE_MASTER_KEY_PATH:/mnt/secrets/csfle-master-key}
  pseudonym:
    # Salt para derivar tokens anonimizados de pacientes. Separado de los datos.
    # En produccion se inyecta via K8s Secret (PSEUDONYM_SALT).
    salt: ${PSEUDONYM_SALT:changeme-dev-salt-rehabiapp}
  # Mapeo entre prefijo del codigo de tratamiento y la metrica relevante.
  # Permite extender los tratamientos sin cambiar codigo.
  metric-map:
    prefix-to-field:
      "[ROM-]": rangeOfMotionDegrees
      "[VEL-]": averageSpeed
      "[FUERZA-]": maxSpeed
    prefix-to-label:
      "[ROM-]": "Rango de movimiento (grados)"
      "[VEL-]": "Velocidad media (m/s)"
      "[FUERZA-]": "Velocidad maxima (m/s)"
  # Cliente HTTP hacia el API Core para escritura de informes en PostgreSQL
  api:
    base-url: ${RH_API_BASE_URL:http://localhost:8080}
    internal-key: ${RH_INTERNAL_KEY:changeme}
    timeout-ms: ${RH_API_TIMEOUT_MS:5000}
    max-retries: ${RH_API_MAX_RETRIES:3}
  # Pool de conexiones MongoDB (ajuste fino para produccion)
  mongo:
    pool:
      min-size: ${RH_MONGO_POOL_MIN:5}
      max-size: ${RH_MONGO_POOL_MAX:50}
      max-wait-time-ms: ${RH_MONGO_POOL_MAX_WAIT_MS:30000}
      max-connection-idle-time-ms: ${RH_MONGO_POOL_IDLE_MS:600000}
