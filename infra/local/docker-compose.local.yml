# RehabiAPP — stack local Docker (replica del de AWS Academy).
#
# Misma topologia que infra/aws-academy/docker-compose.aws.yml pero
# 100% in-cluster: el PostgreSQL corre dentro del propio compose (no RDS),
# Caddy emite certificado auto-firmado con `tls internal` (no Let's Encrypt),
# y el chatbot apunta a un Ollama local del host (tunel no necesario).
#
# Servicios:
#   - caddy             Reverse proxy HTTPS local (puertos 80 / 443 al host).
#   - rehabiapp-postgres PostgreSQL 18 con volumen persistente.
#   - rehabiapp-api      Spring Boot core (profile local) -> Postgres + Data.
#   - rehabiapp-data     Spring Boot pipeline (profile local) -> Mongo.
#   - rehabiapp-mongodb  MongoDB 7 con volumen persistente.
#   - rehabiapp-bff      BFF GraphQL mobile (Node 20) -> API.
#   - rehabiapp-chatbot  WhatsApp + Qwen (Node 20) -> Postgres + Ollama host.
#
# Activacion:
#   cp infra/local/.env.local.example infra/local/.env.local
#   # rellenar secretos (openssl rand -base64 32)
#   docker compose --env-file infra/local/.env.local \
#                  -f infra/local/docker-compose.local.yml up -d --build
#
# Acceso:
#   https://rehabiapp.localhost            -> API + BFF via Caddy
#   http://localhost:8080                  -> API directo (debug)
#   http://localhost:8081                  -> Data directo (debug)
#   http://localhost:3000                  -> BFF directo (debug)
#   http://localhost:5432                  -> Postgres (psql/pgAdmin)
#   http://localhost:27017                 -> Mongo (mongosh/Compass)

services:

  caddy:
    image: caddy:2-alpine
    container_name: rehabiapp-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      rehabiapp-api:
        condition: service_healthy
    networks:
      - rehabiapp-local

  rehabiapp-postgres:
    image: postgres:18
    container_name: rehabiapp-postgres
    restart: unless-stopped
    ports:
      # Exponer al host facilita debug con DBeaver/pgAdmin.
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rehabiapp}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-rehabiapp}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - rehabiapp-local

  rehabiapp-api:
    build:
      context: ../../api
      dockerfile: Dockerfile
    image: rehabiapp-api:local
    container_name: rehabiapp-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://rehabiapp-postgres:5432/${POSTGRES_DB:-rehabiapp}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      RH_INTERNAL_KEY: ${RH_INTERNAL_KEY}
      REHABIAPP_DATA_SERVICE_URL: http://rehabiapp-data:8081
      APP_CORS_ALLOWED_ORIGIN_0: ${APP_CORS_ALLOWED_ORIGIN_0:-http://localhost:5173}
      APP_CORS_EXTRA_ORIGIN: ${APP_CORS_EXTRA_ORIGIN:-http://localhost:3000}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 60s
    networks:
      - rehabiapp-local
    depends_on:
      rehabiapp-postgres:
        condition: service_healthy
      rehabiapp-data:
        condition: service_healthy

  rehabiapp-data:
    build:
      context: ../../data
      dockerfile: Dockerfile
    image: rehabiapp-data:local
    container_name: rehabiapp-data
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATA_MONGODB_URI: mongodb://rehabiapp-mongodb:27017/rehabiapp_telemetry
      SPRING_DATA_MONGODB_DATABASE: rehabiapp_telemetry
      RH_INTERNAL_KEY: ${RH_INTERNAL_KEY}
      RH_API_BASE_URL: http://rehabiapp-api:8080
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 60s
    networks:
      - rehabiapp-local
    depends_on:
      rehabiapp-mongodb:
        condition: service_healthy

  rehabiapp-bff:
    build:
      context: ../../mobile/backend
      dockerfile: Dockerfile
    image: rehabiapp-bff:local
    container_name: rehabiapp-bff
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: "3000"
      LOG_LEVEL: debug
      MOCK_API: "false"
      API_BASE_URL: http://rehabiapp-api:8080
      JWT_SECRET: ${JWT_SIGNING_KEY}
    depends_on:
      rehabiapp-api:
        condition: service_healthy
    networks:
      - rehabiapp-local
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 15s

  rehabiapp-chatbot:
    build:
      context: ../../chatbot
      dockerfile: Dockerfile
    image: rehabiapp-chatbot:local
    container_name: rehabiapp-chatbot
    restart: unless-stopped
    environment:
      NODE_ENV: development
      LOG_LEVEL: info
      PORT: "4000"
      # Conexion al mismo Postgres del compose — el chatbot escribe citas
      # en la misma base que la API para mantener integridad referencial.
      PGHOST: rehabiapp-postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-rehabiapp}
      PGUSER: ${POSTGRES_USER:-admin}
      PGPASSWORD: ${POSTGRES_PASSWORD:-admin}
      PGSSLMODE: disable
      # Ollama corre en el host del dev (laptop). host.docker.internal apunta
      # al gateway docker — sin tunel SSH inverso como en EC2.
      OLLAMA_URL: ${CHATBOT_OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${CHATBOT_OLLAMA_MODEL:-qwen2.5:latest}
      HOSPITAL_PHONE_E164: ${CHATBOT_HOSPITAL_PHONE_E164:-+34600000000}
      AUDIT_ACTOR: CHATBOT_BOT
    volumes:
      - chatbot-wweb-session:/app/.wwebjs_auth
      - chatbot-wweb-cache:/app/.wwebjs_cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rehabiapp-api:
        condition: service_healthy
      rehabiapp-postgres:
        condition: service_healthy
    networks:
      - rehabiapp-local

  rehabiapp-mongodb:
    image: mongo:7
    container_name: rehabiapp-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - rehabiapp-local

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  mongo-data:
  chatbot-wweb-session:
  chatbot-wweb-cache:

networks:
  rehabiapp-local:
    driver: bridge
